name: Bug report
description: Record a reproducible defect and its expected behavior.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Use synthetic or sanitized examples only. Do not include real medication or health records, API tokens, device identifiers, or absolute user paths.
  - type: textarea
    id: impact
    attributes:
      label: User impact
      description: Who is affected and how severe is the consequence?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use exact screens, controls, data conditions, and sequence.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: App revision, device, OS, build type, frequency, logs, screenshots, or measurements without sensitive data.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Fix acceptance criteria
      description: Include regression, failure-path, and device expectations.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Medical, privacy, and data risk
      description: State whether records, reminders, medication guidance, or shared health context may be affected.
    validations:
      required: true
